sendrec:
  replicas: 1

  image:
    repository: ghcr.io/sendrec/sendrec
    tag: "" # appVersion in Chart.yaml if empty
    pullPolicy: Always

  deploymentStrategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate

  # Extra resources injected into the deployment pod
  deployment:
    extraInitContainers: []  # run before main container (e.g. migrations, wait-for)
    extraContainers: []      # sidecar containers
    extraVolumes: []         # pod-level volumes
    extraVolumeMounts: []    # mounts on the main sendrec container

  # Every key below becomes an env var in the ConfigMap; an empty string means "unset", so the app default applies
  env:
    baseUrl: "https://sendrec.yourdomain.com"  # public URL used in share links, emails and OAuth redirect URIs

    # Storage (S3-compatible)
    s3Endpoint: "" # e.g. https://s3.amazonaws.com or https://<your-minio-endpoint>
    s3PublicEndpoint: "" # e.g. https://s3.amazonaws.com, used for generating public URLs to videos
    s3Bucket: "" # e.g. your-bucket-name
    s3Region: "" # e.g. us-east-1
    awsRequestChecksumCalculation: "when_required"  # read by the AWS SDK, not by SendRec: some S3-compatible
    awsResponseChecksumValidation: "when_required"  # backends reject the SDK's default always-on CRC32 checksums

    # Upload / recording limits (0 = unlimited)
    maxUploadBytes: "524288000"   # 500 MB per file; keep in sync with your ingress body-size limit
    maxVideosPerMonth: "0"        # per-user monthly recording quota (default: free plan limit)
    maxVideoDurationSeconds: "0"  # per-recording length cap (default: free plan limit)
    maxPlaylists: "0"             # per-user playlist cap (default: free plan limit)

    # Features
    apiDocsEnabled: "true"        # serve the OpenAPI/Swagger docs route
    brandingEnabled: "true"       # allow custom logo/colors on watch pages
    registrationEnabled: "false"  # public sign-up; "false" makes the instance invite-only
    planBadgeEnabled: "false"     # show plan badges in the UI, only useful with billing configured

    # Security
    trustedProxy: "true"               # "true" only when an ingress controller you control always sets X-Forwarded-For; otherwise every client shares one rate-limit bucket
    rateLimitEnabled: "true"            # "false" only in test/e2e stacks
    webhookAllowPrivateTargets: "false" # "true" lets user webhooks reach loopback/private ranges: an SSRF primitive, local development only

    # Transcription
    transcriptionEnabled: "false"
    transcriptionProvider: "local"  # local | openai | deepgram
    transcriptionApiUrl: ""         # OpenAI-compatible base URL (e.g. https://api.openai.com, https://api.groq.com/openai)
    transcriptionModel: ""          # Provider-specific model override (e.g. whisper-large-v3, nova-3)
    transcriptionTimeoutSeconds: "" # HTTP timeout for cloud calls (default 300)
    whisperModelPath: "/models/ggml-small.bin"  # in-pod model file, only read when transcriptionProvider is local

    # AI (summaries, titles, chapters)
    aiEnabled: "false"
    aiBaseUrl: ""                    # OpenAI-compatible chat completions base URL
    aiModel: "mistral-small-latest"
    aiTimeout: "60s"                 # Go duration, per request

    # Utils
    noiseReductionFilter: ""  # e.g. arnndn=m=/app/models/std.rnnn (model ships in the image) or afftdn=nr=12:nf=-50

    analyticsScript: ""  # exactly one <script> tag, injected into public watch pages

    allowedFrameAncestors: "'self'"  # extra CSP frame-ancestors origins; 'self' is always prepended by the app
    googleAuthAllowedDomains: ""  # Comma-separated email domains allowed for Google SSO, e.g. example.com,example.org

    # Billing (Creem). Product IDs map a Creem product to a plan; the app refuses to start when secrets.creemApiKey is set without secrets.creemWebhookSecret.
    creemProProductId: ""
    creemBusinessProductId: ""
    creemOrgProProductId: ""      # falls back to creemProProductId when empty
    creemOrgBusinessProductId: "" # falls back to creemBusinessProductId when empty

    # Email (Listmonk). Template IDs are numeric Listmonk template IDs; empty disables that mail.
    listmonkBaseUrl: ""                     # when set, transactional mail goes through Listmonk instead of SMTP
    listmonkTemplateId: ""                  # fallback template for mails without a dedicated one
    listmonkCommentTemplateId: ""           # new comment on your video
    listmonkViewTemplateId: ""              # your video was watched
    listmonkConfirmTemplateId: ""           # email address confirmation
    listmonkWelcomeTemplateId: ""           # sent right after signup
    listmonkOnboardingDay2TemplateId: ""    # onboarding drip, day 2
    listmonkOnboardingDay7TemplateId: ""    # onboarding drip, day 7
    listmonkOrgInviteTemplateId: ""         # organization invitation
    listmonkRetentionWarningTemplateId: ""  # heads-up before retention deletes videos
    emailAllowlist: ""                      # if set, only these addresses/domains receive mail and the rest is dropped
    developerEmail: ""                      # when set, every outgoing email is redirected here
    emailFromAddress: ""                    # From: header on outgoing mail

    # Email (SMTP — used when listmonkBaseUrl is unset)
    smtpHost: ""
    smtpPort: ""               # default 587
    smtpTls: ""                # starttls (default), tls, auto, or none
    emailUseSendmail: ""       # "true" to enable local sendmail(8) as a fallback backend

  secrets:
    databaseUrl: ""            # Postgres connection string, e.g. postgres://user:pass@host:5432/db?sslmode=require
    jwtSecret: ""              # Random secret used to sign JWTs (`openssl rand -hex 32`)
    s3AccessKey: ""            # S3 access key ID for the configured bucket
    s3SecretKey: ""            # S3 secret access key for the configured bucket
    googleClientId: ""         # Google OAuth client ID, use /api/auth/sso/google/callback as the redirect URI path
    googleClientSecret: ""     # Google OAuth client secret
    microsoftClientId: ""      # Microsoft OAuth client ID, use /api/auth/sso/microsoft/callback as the redirect URI path
    microsoftClientSecret: ""  # Microsoft OAuth client secret
    githubSsoClientId: ""      # GitHub SSO OAuth client ID, use /api/auth/sso/github/callback as the redirect URI path
    githubSsoClientSecret: ""  # GitHub SSO OAuth client secret
    aiApiKey: ""               # API key for the configured AI provider
    transcriptionApiKey: ""    # API key for cloud transcription provider (openai/deepgram)
    listmonkUsername: ""       # Listmonk API username
    listmonkPassword: ""       # Listmonk API password
    smtpUsername: ""           # SMTP auth username (omit for unauthenticated relays)
    smtpPassword: ""           # SMTP auth password / app password
    creemApiKey: ""            # Creem API key for billing integration
    creemWebhookSecret: ""     # Creem webhook signing secret

  # Use an existing Kubernetes Secret name instead of creating upper secret
  existingSecret: ""

# Transcription model configuration, activation is controlled by env.transcriptionEnabled + env.transcriptionProvider=local
  transcription:
    type: emptyDir           # volume type: emptyDir or volume (persistent volume)
    size: 1Gi                # max size for the model volume (for emptyDir) or PVC storage request (for volume)
    initImage: alpine/curl:8.17.0  # image for the model download init container
    modelUrl: https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin
    modelPath: /models/ggml-small.bin

  port: 8080

  resources:
    limits: {}
    requests:
      cpu: 100m
      memory: 128Mi

  livenessProbe:
    httpGet:
      path: /api/health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /api/health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3

  # NetworkPolicy: restrict ingress to allowed sources only
  networkPolicy:
    enabled: false

    policyTypes:
      - Ingress

    ingress: {}
      # Example allowing ingress only from Traefik in the same cluster:
      # - from:
      #     - namespaceSelector:
      #         matchLabels:
      #           kubernetes.io/metadata.name: traefik

    egress: {}

  service:
    port: 8080
    type: ClusterIP

  ingress:
    enabled: true

    className: "traefik"

    annotations:
      traefik.ingress.kubernetes.io/buffering-maxRequestBodyBytes: "536870912"  # 512 MB
      traefik.ingress.kubernetes.io/buffering-maxResponseBodyBytes: "536870912"
      traefik.ingress.kubernetes.io/buffering-memRequestBodyBytes: "1048576"
      traefik.ingress.kubernetes.io/buffering-memResponseBodyBytes: "1048576"
    pathType: ImplementationSpecific

    hosts:
      - name: sendrec.yourdomain.com
        path: /

    tls: []
    # Example TLS configuration:
    # - hosts:
    #     - sendrec.yourdomain.com
    #   secretName: yourdomain-tls-secret

  # Arbitrary extra Kubernetes resources rendered as-is (e.g. CronJob, ConfigMap)
  extraResources: []
